# OPTIONAL convenience: PostgreSQL 17 with pgvector preinstalled.
# A local PostgreSQL install with pgvector works just as well (see README).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: epolicies
    ports:
      - "5432:5432"
    volumes:
      - epolicies_pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create_test_db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d epolicies"]
      interval: 5s
      retries: 10
volumes:
  epolicies_pgdata:
